name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  aarch64:
    # native arm64 runner; Debian bullseye (glibc 2.31) keeps the binary
    # compatible with both MustardOS and KNULLI userlands
    runs-on: ubuntu-24.04-arm
    container: debian:bullseye
    permissions:
      contents: write
    steps:
      - name: Toolchain
        run: |
          apt-get update
          apt-get install -y --no-install-recommends build-essential pkg-config \
            libsdl2-dev python3 python3-numpy zip git ca-certificates file
      - uses: actions/checkout@v4
      - name: Build
        run: make CFLAGS="-O2 -mcpu=cortex-a53"
      - name: Unit tests
        run: make test
      - name: End-to-end (SDL disk audio, headless)
        run: make test-e2e
      - name: Package
        run: |
          file conduit
          make package
      - uses: actions/upload-artifact@v4
        with:
          name: conduit-aarch64
          path: dist/*.zip
      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          prerelease: true
          files: dist/*.zip
